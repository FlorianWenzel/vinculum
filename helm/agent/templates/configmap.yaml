{{- if .Values.agent.instructions.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent.fullname" . }}-instructions
  labels:
    {{- include "agent.labels" . | nindent 4 }}
data:
{{- range $name, $content := .Values.agent.instructions.files }}
  {{ $name }}: |
{{ $content | nindent 4 }}
{{- end }}
{{- end }}
