apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent.fullname" . }}
  labels:
{{ include "agent.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.agent.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agent.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agent.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ default .Chart.AppVersion .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: SERVER_ADDR
              value: :8090
            - name: WORK_DIR
              value: {{ .Values.agent.workDir | quote }}
            - name: INSTRUCTIONS_DIR
              value: {{ .Values.agent.instructionsDir | quote }}
            - name: OPENCODE_HOST
              value: {{ .Values.agent.opencode.host | quote }}
            - name: OPENCODE_PORT
              value: {{ .Values.agent.opencode.port | quote }}
            - name: OPENCODE_MODEL
              value: {{ .Values.agent.opencode.model | quote }}
            - name: OPENCODE_AGENT
              value: {{ .Values.agent.opencode.agent | quote }}
            - name: OPENCODE_LOG_LEVEL
              value: {{ .Values.agent.opencode.logLevel | quote }}
{{- range $key, $value := .Values.agent.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: workspace
              mountPath: {{ .Values.agent.workDir | quote }}
{{- if .Values.agent.instructions.enabled }}
            - name: instructions
              mountPath: {{ .Values.agent.instructionsDir | quote }}
              readOnly: true
{{- end }}
{{- if .Values.agent.providerAuth.secretName }}
            - name: provider-auth
              mountPath: /auth
              readOnly: true
{{- end }}
      volumes:
        - name: workspace
          emptyDir: {}
{{- if .Values.agent.instructions.enabled }}
        - name: instructions
          configMap:
            name: {{ include "agent.fullname" . }}-instructions
{{- end }}
{{- if .Values.agent.providerAuth.secretName }}
        - name: provider-auth
          secret:
            secretName: {{ .Values.agent.providerAuth.secretName }}
{{- end }}
