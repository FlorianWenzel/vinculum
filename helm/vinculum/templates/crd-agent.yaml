apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.vinculum.dev
spec:
  group: vinculum.dev
  scope: Namespaced
  names:
    plural: agents
    singular: agent
    kind: Agent
    shortNames: [ag]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Model
          type: string
          jsonPath: .spec.model
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image: {type: string}
                concurrency: {type: integer}
                model: {type: string}
                instructionConfigMap: {type: string}
                instructionInline:
                  type: object
                  properties:
                    fileName: {type: string}
                    content: {type: string}
                instructionMountPath: {type: string}
                providerSecretRef:
                  type: object
                  properties:
                    name: {type: string}
                mcpServers:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: {type: string}
                      url: {type: string}
                      command: {type: string}
                      args:
                        type: array
                        items: {type: string}
                      env:
                        type: object
                        additionalProperties: {type: string}
                      secretRef:
                        type: object
                        properties:
                          name: {type: string}
                      enabled: {type: boolean}
                mcpServerRefs:
                  type: array
                  items: {type: string}
                env:
                  type: object
                  additionalProperties: {type: string}
                enabled: {type: boolean}
                workspaceSize: {type: string}
                workspaceStorageClass: {type: string}
                orchestrator: {type: boolean}
                allowedTools:
                  type: array
                  items: {type: string}
                disabledTools:
                  type: array
                  items: {type: string}
                repo:
                  type: object
                  required: [url]
                  properties:
                    url: {type: string}
                    branch: {type: string}
                    path: {type: string}
                gitCredentials:
                  type: object
                  properties:
                    sshKeySecretRef:
                      type: object
                      properties:
                        name: {type: string}
                    tokenSecretRef:
                      type: object
                      properties:
                        name: {type: string}
                    userName: {type: string}
                    userEmail: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
                activeRuns: {type: integer}
                assignedRuns:
                  type: array
                  items: {type: string}
                lastSeen:
                  type: string
                  format: date-time
                deploymentName: {type: string}
                serviceName: {type: string}
                pvcName: {type: string}
                ready: {type: boolean}
                readyReplicas: {type: integer}
                currentTaskRef: {type: string}
                sessionID: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
