apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tasks.vinculum.dev
spec:
  group: vinculum.dev
  scope: Namespaced
  names:
    plural: tasks
    singular: task
    kind: Task
    shortNames: [tk]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Agent
          type: string
          jsonPath: .spec.agentRef
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Pod
          type: string
          jsonPath: .status.podName
        - name: Started
          type: date
          jsonPath: .status.startTime
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [agentRef, prompt]
              properties:
                agentRef: {type: string}
                prompt: {type: string}
                fresh: {type: boolean}
                timeoutSeconds: {type: integer}
                model: {type: string}
                env:
                  type: object
                  additionalProperties: {type: string}
                workspace:
                  type: object
                  properties:
                    mode: {type: string, enum: [shared, ephemeral]}
                artifacts:
                  type: object
                  properties:
                    type: {type: string, enum: [none, s3, pvc, webhook]}
                    sourceDir: {type: string}
                    s3:
                      type: object
                      required: [bucket]
                      properties:
                        bucket: {type: string}
                        prefix: {type: string}
                        endpoint: {type: string}
                        region: {type: string}
                        secretRef:
                          type: object
                          properties:
                            name: {type: string}
                    pvc:
                      type: object
                      required: [claimName]
                      properties:
                        claimName: {type: string}
                        subPath: {type: string}
                    webhook:
                      type: object
                      required: [url]
                      properties:
                        url: {type: string}
                        secretRef:
                          type: object
                          properties:
                            name: {type: string}
                git:
                  type: object
                  properties:
                    baseBranch: {type: string}
                    headBranch: {type: string}
                    commitMessage: {type: string}
                    prTitle: {type: string}
                    prBody: {type: string}
                    skipPR: {type: boolean}
            status:
              type: object
              properties:
                phase: {type: string}
                reason: {type: string}
                message: {type: string}
                podName: {type: string}
                sessionID: {type: string}
                startTime: {type: string, format: date-time}
                completionTime: {type: string, format: date-time}
                exitCode: {type: integer}
                stdoutTail: {type: string}
                stderrTail: {type: string}
                observedGeneration: {type: integer}
                artifactURLs:
                  type: array
                  items: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
