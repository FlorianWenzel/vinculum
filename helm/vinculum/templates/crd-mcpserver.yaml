apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcpservers.vinculum.dev
spec:
  group: vinculum.dev
  scope: Namespaced
  names:
    plural: mcpservers
    singular: mcpserver
    kind: MCPServer
    shortNames: [mcp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.url
          description: http if .spec.url set, otherwise stdio
        - name: Target
          type: string
          jsonPath: .spec.command
        - name: Secret
          type: string
          jsonPath: .spec.secretRef.name
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                url: {type: string}
                command: {type: string}
                args:
                  type: array
                  items: {type: string}
                env:
                  type: object
                  additionalProperties: {type: string}
                secretRef:
                  type: object
                  properties:
                    name: {type: string}
                enabled: {type: boolean}
                timeout: {type: integer}
              oneOf:
                - required: [url]
                - required: [command]
            status:
              type: object
              properties:
                referencedBy:
                  type: array
                  items: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
