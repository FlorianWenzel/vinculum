apiVersion: apps/v1
kind: Deployment
metadata:
  name: vinculum-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vinculum-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vinculum-operator
    spec:
      serviceAccountName: vinculum-operator
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository }}:{{ default .Chart.AppVersion .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          env:
            - name: WATCH_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: AGENT_DEFAULT_IMAGE
              value: {{ printf "%s:%s" .Values.operator.defaultAgentImage.repository (default .Chart.AppVersion .Values.operator.defaultAgentImage.tag) | quote }}
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 1Gi
          ports:
            - containerPort: 8082
              name: metrics
            - containerPort: 8084
              name: api
            - containerPort: 8083
              name: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
