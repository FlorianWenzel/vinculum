apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentschedules.vinculum.dev
spec:
  group: vinculum.dev
  scope: Namespaced
  names:
    plural: agentschedules
    singular: agentschedule
    kind: AgentSchedule
    shortNames: [asched]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Agent
          type: string
          jsonPath: .spec.agentRef
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: Suspend
          type: boolean
          jsonPath: .spec.suspend
        - name: LastRun
          type: date
          jsonPath: .status.lastScheduleTime
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [agentRef, schedule, taskTemplate]
              properties:
                agentRef: {type: string}
                schedule: {type: string}
                timezone: {type: string}
                suspend: {type: boolean}
                concurrencyPolicy: {type: string, enum: [Allow, Forbid, Replace]}
                startingDeadlineSeconds: {type: integer}
                historyLimit: {type: integer}
                taskTemplate:
                  type: object
                  required: [prompt]
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                lastScheduleTime: {type: string, format: date-time}
                active:
                  type: array
                  items: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
