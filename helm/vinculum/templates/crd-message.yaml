apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: messages.vinculum.dev
spec:
  group: vinculum.dev
  scope: Namespaced
  names:
    plural: messages
    singular: message
    kind: Message
    shortNames: [msg]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: From
          type: string
          jsonPath: .spec.from
        - name: To
          type: string
          jsonPath: .spec.to
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: In-Reply-To
          type: string
          jsonPath: .spec.inReplyTo
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [to, body]
              properties:
                to: {type: string}
                from: {type: string}
                body: {type: string}
                inReplyTo: {type: string}
                timeoutSeconds: {type: integer}
            status:
              type: object
              properties:
                phase: {type: string}
                reason: {type: string}
                message: {type: string}
                deliveredAt:
                  type: string
                  format: date-time
                replyMessages:
                  type: array
                  items: {type: string}
                observedGeneration: {type: integer}
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
