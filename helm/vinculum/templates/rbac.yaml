apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vinculum-operator
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "secrets", "persistentvolumeclaims", "services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["vinculum.dev"]
    resources: ["agents", "tasks", "agentschedules", "mcpservers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["vinculum.dev"]
    resources: ["agents/status", "tasks/status", "agentschedules/status", "mcpservers/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["vinculum.dev"]
    resources: ["agents/finalizers", "tasks/finalizers", "agentschedules/finalizers", "mcpservers/finalizers"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vinculum-operator
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: vinculum-operator
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vinculum-operator
