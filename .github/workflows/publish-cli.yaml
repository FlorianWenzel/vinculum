name: Publish vnclm CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/vnclm/go.mod

      - name: Build vnclm
        working-directory: apps/vnclm
        env:
          GOWORK: "off"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          out="dist/vnclm-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          go build -trimpath -buildvcs=false -ldflags "-s -w" -o "$out" ./cmd/vnclm
          (cd dist && sha256sum "vnclm-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" > "vnclm-${{ matrix.goos }}-${{ matrix.goarch }}${ext}.sha256")

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/vnclm/dist/vnclm-*
